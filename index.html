<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal Artecon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gelasio:wght@400;500&family=Red+Hat+Display:wght@600;700;800&family=Red+Hat+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --grafite:#4F4C4D; --vermelho:#BC151B; --ciano:#00AEEF; --amarelo:#FFF200;
  --bg:#FBFEFE; --surface:#FFFFFF; --surface-2:#F2F1F0; --ink:#262324; --ink-2:#5B5758; --ink-3:#8B8788; --line:#E7E5E5;
  --chrome:#4F4C4D; --chrome-2:#5E5A5B; --chrome-deep:#3A3738; --on-chrome:#FFFFFF; --on-chrome-2:#D2D3D6; --chrome-line:rgba(255,255,255,.14);
  --brand:#BC151B; --brand-ink:#9C1015; --brand-soft:#FAEAEA; --link:#0B7CA8; --info-soft:#E3F5FD; --warn-soft:#FFFAC2; --warn-ink:#6A5A00; --ok-ink:#0B7CA8;
  --hero-a:#F7F6F5; --hero-b:#E9E7E6; --b1:#5C5859; --b2:#454142; --b3:#8A8586; --b4:#BCB8B9;
  --shadow:0 1px 2px rgba(35,35,38,.04),0 8px 24px -14px rgba(35,35,38,.16);
  --lift:0 2px 4px rgba(35,35,38,.05),0 18px 36px -18px rgba(35,35,38,.3);
  --r:14px; --r-sm:10px; --sw:268px;
  --font-ui:"Red Hat Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-title:"Red Hat Display","Red Hat Text",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --font-serif:"Bookman Old Style","Gelasio",Georgia,serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171516; --surface:#211F20; --surface-2:#2B2829; --ink:#F3F1F1; --ink-2:#B8B4B5; --ink-3:#8A8687; --line:#383435;
  --chrome:#1A1718; --chrome-2:#2C2829; --chrome-deep:#0E0C0D; --brand:#D2262C; --brand-ink:#F08B8E; --brand-soft:#3A1C1D; --link:#5CC8F3; --info-soft:#10303D; --warn-soft:#38310F; --warn-ink:#FFE45C; --ok-ink:#5CC8F3;
  --hero-a:#232021; --hero-b:#1B1819; --b1:#4A4647; --b2:#333031; --b3:#5E5A5B; --b4:#797576;
  --shadow:0 1px 2px rgba(0,0,0,.3); --lift:0 18px 36px -18px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --bg:#171516; --surface:#211F20; --surface-2:#2B2829; --ink:#F3F1F1; --ink-2:#B8B4B5; --ink-3:#8A8687; --line:#383435;
  --chrome:#1A1718; --chrome-2:#2C2829; --chrome-deep:#0E0C0D; --brand:#D2262C; --brand-ink:#F08B8E; --brand-soft:#3A1C1D; --link:#5CC8F3; --info-soft:#10303D; --warn-soft:#38310F; --warn-ink:#FFE45C; --ok-ink:#5CC8F3;
  --hero-a:#232021; --hero-b:#1B1819; --b1:#4A4647; --b2:#333031; --b3:#5E5A5B; --b4:#797576;
  --shadow:0 1px 2px rgba(0,0,0,.3); --lift:0 18px 36px -18px rgba(0,0,0,.8);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 14.5px/1.5 var(--font-ui);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ul,ol{margin:0;padding:0}ul,ol{list-style:none}
button,input{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--ciano);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}

/* ===== casca ===== */
.app{display:grid;grid-template-columns:var(--sw) minmax(0,1fr);min-height:100dvh;transition:grid-template-columns .28s cubic-bezier(.4,0,.2,1)}
.side{position:sticky;top:0;height:100dvh;background:linear-gradient(180deg,var(--chrome) 0%,var(--chrome-deep) 100%);color:var(--on-chrome);display:flex;flex-direction:column;overflow:hidden auto;z-index:40}
.side-top{min-height:96px;display:flex;align-items:center;padding:18px 20px;flex:none}
.logo{display:block;text-decoration:none;min-width:0;flex:1}
.plate{display:flex;align-items:center;justify-content:center;background:#FFFFFF;border-radius:10px;padding:12px 16px;box-shadow:0 2px 10px -6px rgba(0,0,0,.5)}
.lg-full{width:100%;max-width:186px;height:auto;display:block}
.lg-min{display:none;width:26px;height:auto}
nav{padding:4px 16px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.nav-label{font-size:11.5px;color:var(--on-chrome-2);opacity:.75;padding:16px 14px 6px;white-space:nowrap}
.nav-rule{height:1px;background:var(--chrome-line);margin:12px 8px}
.nav-item{display:flex;align-items:center;gap:14px;width:100%;padding:10px 14px;border-radius:var(--r-sm);color:var(--on-chrome-2);font-weight:500;text-align:left;position:relative;white-space:nowrap;transition:background .15s,color .15s}
.nav-item span{min-width:0;white-space:normal;line-height:1.25;overflow-wrap:break-word}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item[aria-current="page"]{background:var(--vermelho);color:#fff;font-weight:600;box-shadow:0 8px 18px -8px rgba(177,52,55,.7)}
.nav-item .n{margin-left:auto;font-size:12px;opacity:.7;font-style:normal}
.nav-item .pill{margin-left:auto;background:var(--vermelho);color:#fff;font-size:11.5px;font-weight:700;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 6px}
.nav-item[aria-current="page"] .pill{background:#fff;color:var(--vermelho)}
.motto{margin:8px 24px 0;padding-left:14px;position:relative;font-family:var(--font-serif);color:var(--on-chrome-2);font-size:14px;line-height:1.45}
.motto::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:4px;background:linear-gradient(180deg,var(--vermelho) 0 34%,var(--amarelo) 34% 62%,var(--ciano) 62% 100%)}
.side-foot{display:flex;align-items:center;gap:8px;padding:16px 16px 18px;flex:none}
.side-foot .nav-item{flex:1;padding:8px 10px;font-size:13px}
.ver{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;white-space:nowrap}
.side .company-m{display:none}
@media (min-width:821px){
  .app.collapsed{--sw:80px}
  .app.collapsed .side-top{padding:16px 10px;justify-content:center}
  .app.collapsed .plate{padding:10px 8px}
  .app.collapsed .lg-min{display:block}
  .app.collapsed .lg-full,.app.collapsed .nav-item span,.app.collapsed .nav-item .n,.app.collapsed .nav-label,.app.collapsed .ver,.app.collapsed .motto{display:none}
  .app.collapsed .nav-item{justify-content:center;padding:12px 0}
  .app.collapsed .nav-item .pill{position:absolute;top:3px;right:8px;min-width:17px;height:17px;font-size:10px;padding:0 4px}
  .app.collapsed .side-foot .ic{transform:scaleX(-1)}
}
.scrim{display:none}
.top{position:sticky;top:0;z-index:30;height:76px;display:flex;align-items:center;gap:12px;padding:0 28px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.top .logo{display:none}
.icon-btn{width:44px;height:44px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--ink);position:relative;flex:none;transition:background .15s}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn .ic{width:22px;height:22px}
.top .menu-btn,.top .search-btn{display:none}
.search{flex:1 1 380px;max-width:620px;position:relative}
.search label{display:flex;align-items:center;gap:12px;height:46px;padding:0 14px;border:1px solid transparent;border-radius:12px;background:var(--surface-2);color:var(--ink-3);transition:border-color .15s,box-shadow .15s,background .15s}
.search label:focus-within{border-color:var(--ciano);box-shadow:0 0 0 4px var(--info-soft);background:var(--surface)}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;color:var(--ink)}
kbd{font:500 11.5px/1 var(--font-ui);color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
.results{position:absolute;top:54px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--lift);padding:8px;max-height:60vh;overflow:auto}
.results h4,.pop h4{font-size:12px;font-weight:500;color:var(--ink-3);padding:8px 10px 4px}
.results button{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:var(--r-sm);text-align:left}
.results button:hover,.results button.on{background:var(--surface-2)}
.results small{color:var(--ink-3);margin-left:auto;white-space:nowrap}
.results .none{padding:14px 10px;color:var(--ink-2)}
.top>.spacer{flex:0 1 8px;margin-left:auto}
.company{display:flex;align-items:center;gap:10px;height:46px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-width:290px;min-width:0;box-shadow:var(--shadow)}
.company span{min-width:0;text-align:left;line-height:1.2;flex:1}
.company small{display:block;font-size:11.5px;color:var(--ink-3)}
.company b{display:block;font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{position:absolute;top:5px;right:5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--vermelho);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
.profile{display:flex;align-items:center;gap:10px;padding:4px 8px 4px 4px;border-radius:12px;transition:background .15s}
.profile:hover{background:var(--surface-2)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--chrome-deep);color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px;flex:none}
.profile span{text-align:left;line-height:1.25}
.profile b{display:block;font-size:13.5px;font-weight:700}
.profile small{font-size:12px;color:var(--ink-3)}
.pop-wrap{position:relative}
.pop{position:absolute;right:0;top:54px;min-width:280px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--lift);padding:8px;z-index:50;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}}
.pop button.mi{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:var(--r-sm);text-align:left}
.pop button.mi:hover{background:var(--surface-2)}
.pop button.mi[aria-checked="true"]{font-weight:700}
.pop button.mi[aria-checked="true"]::after{content:"";margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--vermelho)}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.seg{display:flex;gap:4px;padding:4px 10px 8px}
.seg button{flex:1;padding:6px;border-radius:8px;border:1px solid var(--line);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{padding:4px 28px 28px;max-width:1560px;width:100%;margin:0 auto}

/* ===== peças ===== */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.panel-head h2{font:700 17px/1.3 var(--font-title);display:flex;align-items:center;gap:10px}
.panel-head .link{margin-left:auto}
.link{color:var(--link);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.link:hover{text-decoration:underline}
.link .ic{width:15px;height:15px}
.tile{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;color:#fff;background:var(--tc,var(--grafite));box-shadow:0 6px 14px -8px var(--tc,var(--grafite))}
.tile.dp{--tc:var(--vermelho)}
.tile.trib,.tile.tributario{--tc:var(--ciano)}
.tile.ge,.tile.gestao{--tc:var(--grafite)}
.tile.cf,.tile.contabil_financeiro{--tc:var(--amarelo);color:#3B3200;box-shadow:0 6px 14px -8px rgba(255,242,0,.9)}
.tile.adm{--tc:#454548}
.tile.lg{width:48px;height:48px;border-radius:13px}.tile.lg .ic{width:24px;height:24px}
.tile.sm{width:34px;height:34px;border-radius:9px}.tile.sm .ic{width:17px;height:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:44px;padding:0 22px;border-radius:10px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap;transition:background .15s,border-color .15s,transform .15s,box-shadow .15s}
.btn:hover{border-color:var(--ink-3)}.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 10px 20px -10px rgba(177,52,55,.8)}
.btn.primary:hover{background:var(--brand-ink);border-color:var(--brand-ink)}
.btn.sm{height:36px;padding:0 14px;font-size:13px}
.btn .ic{width:17px;height:17px}
.go{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;background:var(--brand-soft);color:var(--brand-ink);font-weight:600;font-size:12.5px;white-space:nowrap;transition:background .18s,color .18s}
.go .ic{width:14px;height:14px;transition:transform .18s}
.go:hover,.hover-go:hover .go{background:var(--brand);color:#fff}
.go:hover .ic,.hover-go:hover .go .ic{transform:translateX(2px)}
.go.ghost{background:var(--surface-2);color:var(--ink-2)}
.go.ghost:hover{background:var(--grafite);color:#fff}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--k,var(--ink-3));flex:none}
.status.op{--k:var(--ciano)}.status.inst,.status.man{--k:#C2A800}.status.sus{--k:var(--vermelho)}.status.prep{--k:var(--ink-3)}
.chip{display:inline-flex;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
.chip.imp{background:var(--brand-soft);color:var(--brand-ink)}.chip.info{background:var(--info-soft);color:var(--link)}.chip.warn{background:var(--warn-soft);color:var(--warn-ink)}
.empty{padding:24px 8px;text-align:center;color:var(--ink-2)}.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* ===== início ===== */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 344px;gap:20px;align-items:start}
.center,.rail{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;min-width:0}
.hero{position:relative;overflow:hidden;border-radius:16px;min-height:256px;background:linear-gradient(100deg,var(--hero-a) 0%,var(--hero-a) 38%,var(--hero-b) 100%);border:1px solid var(--line);display:flex;align-items:center}
.hero-text{position:relative;z-index:2;padding:30px 32px;max-width:520px}
.eyebrow{font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.hero h1{font:800 clamp(30px,3.3vw,44px)/1.06 var(--font-title);letter-spacing:-.015em;margin:10px 0 12px}
.hero h1 em{font-style:normal;color:var(--vermelho)}
.hero p{color:var(--ink-2);font-size:15px;margin-bottom:20px;max-width:44ch}
.hero p b{color:var(--ink);font-weight:700}
.hero-art{position:absolute;right:0;top:0;height:100%;width:62%;z-index:1;animation:art .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes art{from{opacity:0;transform:translateX(24px)}}
.hero-words{position:absolute;right:22px;top:12px;z-index:2;font-size:9.5px;letter-spacing:.26em;color:var(--ink-2);line-height:1.85;padding-left:14px;border-left:2px solid var(--vermelho);text-transform:uppercase}
.sec-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:12px}
.sec-head h2{font:700 20px/1.2 var(--font-title)}
.sec-head p{color:var(--ink-2);font-size:14px;margin-top:2px}
.sec-head .link{margin-left:auto}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(186px,1fr));gap:14px}
.area{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 16px 14px;min-height:196px;transition:transform .22s,box-shadow .22s,border-color .22s}
.area:hover{transform:translateY(-3px);box-shadow:var(--lift);border-color:transparent}
.area h3{font:700 15px/1.25 var(--font-title);margin:14px 0 6px;overflow-wrap:break-word;hyphens:auto}
.area p{color:var(--ink-2);font-size:12.5px;line-height:1.45;flex:1}
.area-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.pair{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;align-items:stretch}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:6px 0 10px}
.kpi{padding:0 14px;border-left:1px solid var(--line);text-align:left}
.kpi:first-child{border-left:0;padding-left:4px}
.kpi span{display:block;font-size:12.5px;color:var(--ink-2)}
.kpi b{display:block;font:800 24px/1.25 var(--font-title)}
.kpi small{font-size:12px;font-weight:600;color:var(--ok-ink)}
.kpi small.warn{color:var(--brand-ink)}.kpi small.mute{color:var(--ink-3);font-weight:500}
.select{white-space:nowrap;display:inline-flex;align-items:center;gap:10px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;margin-left:auto;background:var(--surface)}
.select .ic{width:15px;height:15px}
.legend{display:flex;gap:16px;justify-content:flex-end;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.chart{width:100%;height:auto;display:block}
.chart text{font:500 11.5px var(--font-ui);fill:var(--ink-3)}
.chart .g{stroke:var(--line)}
.row-li{display:flex;align-items:center;gap:14px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.row-li:first-of-type{border-top:0}
.row-li div{min-width:0;flex:1}
.row-li b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-li small{color:var(--ink-2);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-li time,.row-li .when{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.row-li .when b{display:inline;font-size:12.5px;color:var(--ink)}
.row-li .when.hoje b{color:var(--brand-ink)}
.row-li>.ic{width:16px;height:16px;color:var(--ink-3)}
.star{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink-3);flex:none;transition:background .15s}
.star:hover{background:var(--surface-2)}
.star .ic{width:19px;height:19px}
.star[aria-pressed="true"] .ic{fill:var(--amarelo);color:#B8A000}
.star[aria-pressed="true"]{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.25)}}
.quote{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));border:1px solid var(--line);border-radius:var(--r);padding:26px 26px 24px;min-height:150px}
.quote p{font:400 20px/1.4 var(--font-serif);max-width:16em;position:relative}
.quote i{display:block;width:28px;height:3px;border-radius:2px;background:var(--amarelo);margin:14px 0 12px}
.quote small{font-size:10.5px;letter-spacing:.24em;color:var(--ink-2);text-transform:uppercase}
.quote svg{position:absolute;right:14px;bottom:-18px;width:62px;opacity:.55}
.nt-row{background:var(--surface-2);border-radius:10px;padding:10px 12px;border:0;margin-top:8px}
.nt-row:first-of-type{margin-top:0}
.nt-row.unread b::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ciano);margin-left:8px;vertical-align:middle}
.notice{padding:12px 0;border-top:1px solid var(--line)}
.notice:first-of-type{border-top:0;padding-top:2px}
.notice b{display:block;font-weight:600;margin:6px 0 2px}

/* ------------------------------------------------------------------
   4. ENTRADA
------------------------------------------------------------------- */
function msgLogin(texto, tipo) {
  var el = $("#loginMsg");
  el.textContent = texto || "";
  el.className = "msg" + (texto ? " on " + (tipo || "erro") : "");
}

function ligarLogin() {
  $("#formLogin").addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = $("#btnEntrar");
    btn.disabled = true; btn.textContent = "Entrando…";
    msgLogin("");
    sb.auth.signInWithPassword({
      email: $("#email").value.trim(),
      password: $("#senha").value
    }).then(function (r) {
      btn.disabled = false; btn.textContent = "Entrar";
      if (r.error) { msgLogin(explicar(r.error)); return; }
      $("#senha").value = "";
      iniciarSessao(r.data.session);
    }).catch(function (e2) {
      btn.disabled = false; btn.textContent = "Entrar";
      msgLogin(explicar(e2));
    });
  });

  $("#btnRecuperar").addEventListener("click", function () {
    var email = $("#email").value.trim();
    if (!email) { msgLogin("Escreva o e-mail antes de pedir a recuperação."); $("#email").focus(); return; }
    sb.auth.resetPasswordForEmail(email, { redirectTo: location.href }).then(function () {
      msgLogin("Se este e-mail estiver cadastrado, a mensagem de recuperação foi enviada.", "ok");
    });
  });
}

function sair() {
  sb.auth.signOut().then(function () { location.reload(); });
}

/* ------------------------------------------------------------------
   5. CARREGAMENTO DO CONTEXTO
------------------------------------------------------------------- */
function iniciarSessao(sessao) {
  st.sessao = sessao;
  $("#telaLogin").hidden = true;
  $("#app").hidden = false;
  $("#tela").innerHTML = '<div class="carregando"><div class="spin"></div>Carregando seu acesso…</div>';
  carregarContexto();
}

function carregarContexto() {
  var core = sb.schema("core");
  var uid = st.sessao.user.id;

  Promise.all([
    core.from("profiles").select("user_id,nome,email,situacao").eq("user_id", uid).maybeSingle(),
    core.from("organizations").select("id,nome,slug,situacao"),
    core.from("memberships").select("org_id,papel,situacao").eq("user_id", uid).eq("situacao", "ativo")
  ]).then(function (r) {
    var perfil = r[0], orgs = r[1], vinculos = r[2];
    if (perfil.error) throw perfil.error;
    if (orgs.error) throw orgs.error;
    if (vinculos.error) throw vinculos.error;

    if (!perfil.data) {
      telaSemVinculo("Seu usuário entrou, mas ainda não tem cadastro no portal. Peça a um administrador para incluir você.");
      return;
    }
    if (!vinculos.data || !vinculos.data.length) {
      telaSemVinculo("Seu usuário não está vinculado a nenhuma organização.");
      return;
    }

    st.perfil = perfil.data;
    st.orgs = orgs.data || [];
    var preferida = ler("org", null);
    var v = vinculos.data.filter(function (x) { return x.org_id === preferida; })[0] || vinculos.data[0];
    st.org = v.org_id;
    st.papel = v.papel;
    guardar("org", st.org);

    st.favoritos = ler("fav_" + uid, []);
    st.recentes = ler("rec_" + uid, []);

    return Promise.all([
      core.rpc("catalogo_do_usuario", { p_org: st.org }),
      core.from("companies").select("id,nome,situacao").eq("org_id", st.org).order("nome")
    ]);
  }).then(function (r) {
    if (!r) return;
    if (r[0].error) throw r[0].error;
    st.catalogo = r[0].data || [];
    st.empresas = (r[1] && r[1].data) || [];
    var emp = ler("empresa", null);
    st.empresaAtiva = st.empresas.filter(function (e) { return e.id === emp; })[0] || null;
    desenhar();
  }).catch(function (e) {
    $("#tela").innerHTML =
      '<div class="page-head"><div><h1>Não deu para carregar</h1>' +
      '<p>' + esc(explicar(e)) + '</p></div></div>' +
      '<section class="panel"><p style="color:var(--ink-2)">Se o erro falar em schema, confira em Settings → API se o schema <b>core</b> está exposto. ' +
      'Se falar em permissão, seu usuário pode não ter vínculo ativo.</p>' +
      '<div style="margin-top:14px"><button class="btn" data-acao="sair">Sair</button></div></section>';
  });
}

function telaSemVinculo(texto) {
  $("#tela").innerHTML =
    '<div class="page-head"><div><h1>Acesso não liberado</h1><p>' + esc(texto) + '</p></div></div>' +
    '<section class="panel"><div class="vazio"><b>' + esc(st.sessao.user.email) + '</b>' +
    'Fale com um administrador do escritório.</div>' +
    '<div style="display:flex;justify-content:center"><button class="btn" data-acao="sair">Sair</button></div></section>';
  $("#nav").innerHTML = "";
}

function souAdmin() { return st.papel === "admin" || st.papel === "superadmin"; }
function orgAtual() { return st.orgs.filter(function (o) { return o.id === st.org; })[0] || { nome: "Artecon" }; }
function iniciais(nome) {
  var p = (nome || "?").trim().split(/\s+/);
  return ((p[0] || "?")[0] + (p.length > 1 ? p[p.length - 1][0] : "")).toUpperCase();
}

   6. CASCA
------------------------------------------------------------------- */
function casca() {
  $("#app").classList.toggle("collapsed", st.recolhido);
  $("#verBadge").textContent = VERSAO;
  $("#footVer").textContent = "Portal Artecon " + VERSAO;

  var itens = [["inicio", "Início", "home"], ["apps", "Aplicativos", "grid"]];
  if (souAdmin()) itens.push(["acessos", "Acessos", "key"], ["auditoria", "Auditoria", "audit"]);

  var h = itens.map(function (i) {
    return '<button class="nav-item" data-ir="' + i[0] + '" title="' + i[1] + '"' +
      (st.tela === i[0] ? ' aria-current="page"' : "") + ">" + ic(i[2]) + "<span>" + i[1] + "</span></button>";
  }).join("");

  var areas = agrupar();
  if (areas.length) {
    h += '<div class="nav-rule"></div>';
    areas.forEach(function (a) {
      var n = a.apps.filter(function (x) { return x.estado === "abrir"; }).length;
      if (!n) return;
      h += '<button class="nav-item" data-area="' + esc(a.id) + '" title="' + esc(a.nome) + '">' +
        ic(ICONE_AREA[a.id] || "grid") + "<span>" + esc(a.nome) + '</span><i class="n">' + n + "</i></button>";
    });
  }
  h += '<div class="nav-rule"></div>' +
    '<button class="nav-item" data-ir="versoes" title="Versões"' + (st.tela === "versoes" ? ' aria-current="page"' : "") + ">" +
    ic("clock") + "<span>Versões</span></button>";
  $("#nav").innerHTML = h;

  var nomeEmpresa = st.empresaAtiva ? st.empresaAtiva.nome : orgAtual().nome;
  var botao = ic("org") + "<span><small>Empresa ativa</small><b>" + esc(nomeEmpresa) + "</b></span>" + ic("chevd");
  $$(".company").forEach(function (b) { b.innerHTML = botao; });

  $("#popEmpresa").innerHTML = st.empresas.length
    ? "<h4>Trocar a empresa ativa</h4>" +
      '<button class="mi" role="menuitemradio" aria-checked="' + (!st.empresaAtiva) + '" data-empresa="">Todas as empresas</button>' +
      st.empresas.map(function (e) {
        return '<button class="mi" role="menuitemradio" aria-checked="' +
          (!!st.empresaAtiva && st.empresaAtiva.id === e.id) + '" data-empresa="' + esc(e.id) + '">' + esc(e.nome) + "</button>";
      }).join("")
    : '<h4>Empresas</h4><div style="padding:6px 10px 12px;color:var(--ink-2);font-size:14px">Nenhuma empresa cadastrada ainda. O portal está mostrando a organização.</div>';

  $("#btnPerfil").innerHTML =
    '<div class="avatar">' + esc(iniciais(st.perfil.nome)) + "</div>" +
    "<span><b>" + esc(st.perfil.nome) + "</b><small>" + esc(rotuloPapel(st.papel)) + "</small></span>" + ic("chevd");

  $("#popPerfil").innerHTML =
    "<h4>" + esc(st.perfil.email || "") + "</h4>" +
    '<button class="mi" data-acao="trocarSenha">Trocar minha senha</button>' +
    "<hr><h4>Aparência</h4><div class=\"seg\">" +
    [["auto", "Auto"], ["light", "Claro"], ["dark", "Escuro"]].map(function (t) {
      return '<button data-tema="' + t[0] + '" aria-pressed="' + (st.tema === t[0]) + '">' + t[1] + "</button>";
    }).join("") + "</div><hr>" +
    '<button class="mi" data-acao="sair">' + ic("sair") + "Sair</button>";
}

function rotuloPapel(p) {
  return { superadmin: "Superadministrador", admin: "Administrador", operador: "Operador", cliente: "Cliente" }[p] || p;
}

function agrupar() {
  var mapa = {}, ordem = [];
  st.catalogo.forEach(function (a) {
    if (!mapa[a.area_id]) { mapa[a.area_id] = { id: a.area_id, nome: a.area_nome, apps: [] }; ordem.push(mapa[a.area_id]); }
    mapa[a.area_id].apps.push(a);
  });
  return ordem;
}

  var h = new Date().getHours();
  return h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite";
}
function hoje() {
  var s = new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function cartao(a) {
  var fav = st.favoritos.indexOf(a.app_id) > -1;
  var tile = '<span class="tile ' + esc(a.area_id) + ' lg">' + ic(iconeDe(a)) + "</span>";

  if (a.estado === "abrir") {
    return '<article class="card open hover-go"><div class="card-top">' + tile +
      '<button class="star" data-fav="' + esc(a.app_id) + '" aria-pressed="' + fav + '" aria-label="Favorito">' + ic("star") + "</button></div>" +
      "<h3>" + esc(a.nome) + "</h3><p>" + esc(a.descricao || "") + "</p>" +
      '<div class="card-foot"><span class="status ' + (CLASSE_SITUACAO[a.situacao] || "") + '">' +
      esc(ROTULO_SITUACAO[a.situacao] || a.situacao) + "</span>" +
      '<button class="go" data-abrir="' + esc(a.app_id) + '">Acessar' + ic("arrow") + "</button></div></article>";

function resumirApps(lista) {
  var nomes = lista.map(function (x) { return x.nome; });
  if (nomes.length <= 3) return nomes.join(", ");
  return nomes.slice(0, 3).join(", ") + " e mais " + (nomes.length - 3);
}

function quandoTexto(iso) {
  var min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (min < 1) return "agora";
  if (min < 60) return "há " + min + " min";
  var hrs = Math.round(min / 60);
  if (hrs < 24) return "há " + hrs + (hrs === 1 ? " hora" : " horas");
  var d = Math.round(hrs / 24);
  return d === 1 ? "ontem" : "há " + d + " dias";
}

function fachada() {

    '<defs><linearGradient id="fL" x1="0" x2="1"><stop offset="0" stop-color="var(--b3)"/><stop offset="1" stop-color="var(--b1)"/></linearGradient>' +
    '<linearGradient id="fR" x1="0" x2="1"><stop offset="0" stop-color="var(--b2)"/><stop offset="1" stop-color="var(--b1)"/></linearGradient>' +
    '<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="var(--hero-a)"/><stop offset=".55" stop-color="var(--hero-a)" stop-opacity="0"/></linearGradient></defs>' +
    '<polygon points="330,0 560,0 560,256 250,256" fill="var(--b4)" opacity=".25"/>' +
    '<polygon points="120,256 120,150 330,22 330,256" fill="url(#fL)"/>' +
    '<polygon points="330,22 560,96 560,256 330,256" fill="url(#fR)"/>';
  for (var k = 1; k < 9; k++) {
    s += '<line x1="330" y1="' + (22 + k * 30) + '" x2="120" y2="' + (150 + k * 15) + '" stroke="#fff" stroke-opacity=".16"/>';
    s += '<line x1="330" y1="' + (22 + k * 30) + '" x2="560" y2="' + (96 + k * 21) + '" stroke="#fff" stroke-opacity=".08"/>';
  }
  for (var j = 1; j < 7; j++) {
    var x = 330 - j * 34;
    s += '<line x1="' + x + '" y1="' + (22 + j * 20.7) + '" x2="' + x + '" y2="256" stroke="#fff" stroke-opacity=".13"/>';
  }
  s += '<line x1="330" y1="22" x2="330" y2="256" stroke="#fff" stroke-opacity=".35"/>';
  s += '<g transform="translate(352,58) skewY(17.800)" style="--lg-ink:#FFFFFF;--lg-paper:#4A4648;--lg-rd:#FFFFFF;--lg-yl:#FFFFFF;--lg-cy:#FFFFFF">' +
    '<svg x="0" y="0" width="172" height="91" viewBox="0 0 392 207"><use href="#lg"/></svg></g>';
  return s + '<rect width="560" height="256" fill="url(#fade)"/></svg>';
}

T.acessos = function () {

function carregarAcessos() {
  var core = sb.schema("core");
  Promise.all([
    core.from("memberships").select("user_id,papel,situacao").eq("org_id", st.org).order("papel"),
    core.from("profiles").select("user_id,nome,email,situacao"),
    core.from("app_access").select("id,user_id,app_id,papel,situacao,validade").eq("org_id", st.org)
  ]).then(function (r) {
    if (r[0].error) throw r[0].error;
    var vinculos = r[0].data || [], perfis = r[1].data || [], acessos = r[2].data || [];
    var porId = {}; perfis.forEach(function (p) { porId[p.user_id] = p; });
    var apps = {}; st.catalogo.forEach(function (a) { apps[a.app_id] = a; });

    var linhas = vinculos.map(function (v) {
      var p = porId[v.user_id] || { nome: "(sem cadastro)", email: "" };
      var meus = acessos.filter(function (a) { return a.user_id === v.user_id && a.situacao === "ativo"; });
      var chips = meus.length
        ? meus.map(function (a) {
            var nome = apps[a.app_id] ? apps[a.app_id].nome : a.app_id;
            return '<span class="tag ok">' + esc(nome) + (a.papel === "admin" ? " · adm" : "") + "</span>";
          }).join(" ")
        : '<span class="tag">nenhum</span>';
      return "<tr><td><b>" + esc(p.nome) + '</b><br><small style="color:var(--ink-2)">' + esc(p.email) + "</small></td>" +
        '<td><span class="tag ' + (v.papel === "operador" ? "" : "adm") + '">' + esc(rotuloPapel(v.papel)) + "</span></td>" +
        '<td><span class="tag ' + (v.situacao === "ativo" ? "ok" : "no") + '">' + esc(v.situacao) + "</span></td>" +
        '<td style="white-space:normal">' + chips + "</td>" +
        '<td><div class="acoes">' +
        '<button class="mini" data-conceder="' + esc(v.user_id) + '">Liberar</button>' +
        (meus.length ? '<button class="mini rd" data-revogar="' + esc(v.user_id) + '">Revogar</button>' : "") +
        "</div></td></tr>";
    }).join("");

    $("#painelAcessos").innerHTML =
      '<div style="overflow-x:auto"><table class="tb"><thead><tr>' +
      "<th>Pessoa</th><th>Papel</th><th>Situação</th><th>Aplicativos liberados</th><th></th>" +
      "</tr></thead><tbody>" + linhas + "</tbody></table></div>";
  }).catch(function (e) {
    $("#painelAcessos").innerHTML = '<div class="vazio"><b>Não deu para carregar</b>' + esc(explicar(e)) + "</div>";
  });
}

function dialogoConceder(userId) {
  var core = sb.schema("core");
  core.from("profiles").select("nome,email").eq("user_id", userId).maybeSingle().then(function (r) {
    var p = r.data || { nome: "" };
    var opcoes = st.catalogo
      .filter(function (a) { return a.situacao !== "preparacao" && a.situacao !== "descontinuado"; })
      .map(function (a) { return '<option value="' + esc(a.app_id) + '">' + esc(a.nome) + " · " + esc(a.area_nome) + "</option>"; })
      .join("");
    abrirDialogo(
      "<h2>Liberar aplicativo</h2><p>Para <b>" + esc(p.nome) + "</b>.</p>" +
      '<div class="f"><label for="dApp">Aplicativo</label><select class="sel" id="dApp">' + opcoes + "</select></div>" +
      '<div class="f"><label for="dPapel">Papel dentro do aplicativo</label><select class="sel" id="dPapel">' +
      '<option value="operador">Operador</option><option value="admin">Administrador</option><option value="leitura">Leitura</option>' +
      "</select></div>" +
      '<div class="dlg-acoes"><button class="btn" data-fechar>Cancelar</button>' +
      '<button class="btn primary" id="dOk">Liberar</button></div>',
      function () {
        $("#dOk").addEventListener("click", function () {
          var btn = this; btn.disabled = true; btn.textContent = "Liberando…";
          core.rpc("conceder_acesso", {
            p_org: st.org, p_user: userId, p_app: $("#dApp").value, p_papel: $("#dPapel").value
          }).then(function (r2) {
            btn.disabled = false; btn.textContent = "Liberar";
            if (r2.error) { toast(explicar(r2.error)); return; }
            var res = r2.data || {};
            if (res.ok) { $("#dlg").close(); toast("Acesso liberado"); carregarAcessos(); }
            else toast("Recusado: " + (res.motivo || "sem motivo informado"));
          });
        });
      }
    );
  });
}

function dialogoRevogar(userId) {
  var core = sb.schema("core");
  Promise.all([
    core.from("profiles").select("nome").eq("user_id", userId).maybeSingle(),
    core.from("app_access").select("app_id,papel").eq("org_id", st.org).eq("user_id", userId).eq("situacao", "ativo")
  ]).then(function (r) {
    var p = r[0].data || { nome: "" };
    var apps = {}; st.catalogo.forEach(function (a) { apps[a.app_id] = a.nome; });
    var opcoes = (r[1].data || []).map(function (a) {
      return '<option value="' + esc(a.app_id) + '">' + esc(apps[a.app_id] || a.app_id) + "</option>";
    }).join("");
    if (!opcoes) { toast("Esta pessoa não tem acesso ativo."); return; }
    abrirDialogo(
      "<h2>Revogar acesso</h2><p>De <b>" + esc(p.nome) + "</b>. O histórico é preservado e a revogação fica registrada na auditoria.</p>" +
      '<div class="f"><label for="rApp">Aplicativo</label><select class="sel" id="rApp">' + opcoes + "</select></div>" +
      '<div class="dlg-acoes"><button class="btn" data-fechar>Cancelar</button>' +
      '<button class="btn primary" id="rOk" style="background:var(--brand);border-color:var(--brand)">Revogar</button></div>',
      function () {
        $("#rOk").addEventListener("click", function () {
          var btn = this; btn.disabled = true;
          core.rpc("revogar_acesso", { p_org: st.org, p_user: userId, p_app: $("#rApp").value })
            .then(function (r2) {
              btn.disabled = false;
              if (r2.error) { toast(explicar(r2.error)); return; }
              var res = r2.data || {};
              if (res.ok) { $("#dlg").close(); toast("Acesso revogado"); carregarAcessos(); }
              else toast("Recusado: " + (res.motivo || ""));
            });
        });
      }
    );
  });
}

function abrirApp(id) {
  var a = st.catalogo.filter(function (x) { return x.app_id === id; })[0];
  if (!a) return;
  if (a.estado !== "abrir") { toast("Este aplicativo não está liberado para você."); return; }

  st.recentes = [{ id: id, quando: new Date().toISOString() }]
    .concat(st.recentes.filter(function (r) { return r.id !== id; })).slice(0, 8);
  guardar("rec_" + st.sessao.user.id, st.recentes);

  var destino = a.destino_url || "";
  if (/^https?:\/\//i.test(destino)) window.open(destino, "_blank", "noopener");
  else toast("Esta tela ainda está sendo preparada dentro do portal.");
  if (st.tela === "inicio") desenhar();
}

function alternarFavorito(id) {
  var i = st.favoritos.indexOf(id);
  if (i > -1) st.favoritos.splice(i, 1); else st.favoritos.push(id);
  guardar("fav_" + st.sessao.user.id, st.favoritos);
  desenhar();
  toast(i > -1 ? "Tirado dos favoritos" : "Marcado como favorito");
}

function trocarSenha() {
  fecharPops();
  abrirDialogo(
    "<h2>Trocar minha senha</h2><p>A nova senha precisa de pelo menos 8 caracteres.</p>" +
    '<div class="f"><label for="s1">Nova senha</label><input id="s1" type="password" autocomplete="new-password"></div>' +
    '<div class="f"><label for="s2">Repita a nova senha</label><input id="s2" type="password" autocomplete="new-password"></div>' +
    '<div class="dlg-acoes"><button class="btn" data-fechar>Cancelar</button>' +
    '<button class="btn primary" id="sOk">Trocar senha</button></div>',
    function () {
      $("#sOk").addEventListener("click", function () {
        var a = $("#s1").value, b = $("#s2").value;
        if (a.length < 8) { toast("A senha precisa de pelo menos 8 caracteres."); return; }
        if (a !== b) { toast("As duas senhas não conferem."); return; }
        var btn = this; btn.disabled = true; btn.textContent = "Trocando…";
        sb.auth.updateUser({ password: a }).then(function (r) {
          btn.disabled = false; btn.textContent = "Trocar senha";
          if (r.error) { toast(explicar(r.error)); return; }
          $("#dlg").close(); toast("Senha trocada");
        });
      });
    }
  );
}

function abrirDialogo(html, depois) {
  $("#dlgIn").innerHTML = html;
  $("#dlg").showModal();
  if (depois) depois();
}
function fecharPops() { $$(".pop").forEach(function (p) { p.hidden = true; }); }

function tema(t) {
  st.tema = t;
  if (t === "auto") delete document.documentElement.dataset.tema, document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  guardar("tema", t);
}

/* ------------------------------------------------------------------
   9. PESQUISA
------------------------------------------------------------------- */
var achados = [], destaque = 0;

function pesquisar() {
  var q = $("#busca").value.trim().toLowerCase(), caixa = $("#resultados");
  if (!q) { caixa.hidden = true; return; }
  var bate = function (s) { return (s || "").toLowerCase().indexOf(q) > -1; };

  var apps = st.catalogo.filter(function (a) {
    return a.estado === "abrir" && (bate(a.nome) || bate(a.descricao));
  }).slice(0, 6);
  var empresas = st.empresas.filter(function (e) { return bate(e.nome); }).slice(0, 4);

  achados = apps.map(function (a) { return { f: function () { abrirApp(a.app_id); } }; })
    .concat(empresas.map(function (e) {
      return { f: function () { st.empresaAtiva = e; guardar("empresa", e.id); desenhar(); toast("Empresa ativa: " + e.nome); } };
    }));

  destaque = 0;
  var i = 0, h = "";
  if (apps.length) {
    h += "<h4>Aplicativos</h4>" + apps.map(function (a) {
      return '<button data-achado="' + (i++) + '"><span class="tile sm ' + esc(a.area_id) + '">' + ic(iconeDe(a)) + "</span>" +
        "<span>" + esc(a.nome) + "</span><small>" + esc(a.area_nome) + "</small></button>";
    }).join("");
  }
  if (empresas.length) {
    h += "<h4>Empresas</h4>" + empresas.map(function (e) {
      return '<button data-achado="' + (i++) + '">' + ic("org") + "<span>" + esc(e.nome) + "</span><small>Tornar ativa</small></button>";
    }).join("");
  }
  caixa.innerHTML = h || '<div class="none">Nada encontrado. A pesquisa só alcança o que está liberado para você.</div>';
  caixa.hidden = false;
  marcar();
}
function marcar() { $$("[data-achado]").forEach(function (b, i) { b.classList.toggle("on", i === destaque); }); }
function irAchado(i) {
  if (!achados[i]) return;
  $("#busca").value = ""; $("#resultados").hidden = true; $("#top").classList.remove("searching");
  achados[i].f();
}

/* ------------------------------------------------------------------
   10. DESENHO E NAVEGAÇÃO
------------------------------------------------------------------- */
function desenhar() {
  casca();
  $("#tela").innerHTML = '<div class="view-in">' + (T[st.tela] || T.inicio)() + "</div>";
}
function ir(t) {
  st.tela = t;
  $("#app").classList.remove("side-open");
  desenhar();
  scrollTo(0, 0);
}

document.addEventListener("click", function (e) {
  var alvo = e.target.closest("[data-ir],[data-acao],[data-pop],[data-area],[data-abrir],[data-fav]," +
    "[data-pedir],[data-empresa],[data-tema],[data-achado],[data-conceder],[data-revogar],[data-fechar]");

  if (!e.target.closest(".pop-wrap") && !e.target.closest(".company-m")) fecharPops();
  if (!e.target.closest(".search")) { var r = $("#resultados"); if (r) r.hidden = true; }
  if (!alvo) return;
  if (alvo.tagName === "A") e.preventDefault();

  var d = alvo.dataset;

  if (d.pop) {
    var p = $("#" + d.pop), estava = p.hidden;
    fecharPops(); p.hidden = !estava;
    if (alvo.classList.contains("company-m")) $("#app").classList.remove("side-open");
    return;
  }
  if (d.achado !== undefined) return irAchado(+d.achado);
  if (d.ir) return ir(d.ir);
  if (d.area) {
    st.tela = "apps"; $("#app").classList.remove("side-open"); desenhar();
    var el = $("#area-" + d.area); if (el) el.scrollIntoView(); else scrollTo(0, 0);
    return;
  }
  if (d.abrir) return abrirApp(d.abrir);
  if (d.fav) return alternarFavorito(d.fav);
  if (d.pedir) {
    toast({
      solicitar: "Pedido registrado com um administrador do escritório.",
      contratar: "A Artecon vai apresentar as condições de " + (d.app || "") + ".",
      suspenso: "Fale com a Artecon para regularizar."
    }[d.pedir] || "");
    return;
  }
  if (d.empresa !== undefined) {
    st.empresaAtiva = st.empresas.filter(function (x) { return x.id === d.empresa; })[0] || null;
    guardar("empresa", st.empresaAtiva ? st.empresaAtiva.id : null);
    fecharPops(); desenhar();
    toast("Empresa ativa: " + (st.empresaAtiva ? st.empresaAtiva.nome : "todas"));
    return;
  }
  if (d.tema) { tema(d.tema); casca(); return; }
  if (d.conceder) return dialogoConceder(d.conceder);
  if (d.revogar) return dialogoRevogar(d.revogar);
  if (d.fechar !== undefined) return $("#dlg").close();

  var a = d.acao;
  if (a === "recolher") { st.recolhido = !st.recolhido; guardar("recolhido", st.recolhido); casca(); }
  if (a === "abrirMenu") $("#app").classList.add("side-open");
  if (a === "fecharMenu") $("#app").classList.remove("side-open");
  if (a === "buscar") { $("#top").classList.add("searching"); $("#busca").focus(); }
  if (a === "sair") sair();
  if (a === "trocarSenha") trocarSenha();
});

document.addEventListener("keydown", function (e) {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    if ($("#app").hidden) return;
    $("#top").classList.add("searching"); $("#busca").focus();
    return;
  }
  if (document.activeElement === $("#busca")) {
    if (e.key === "ArrowDown") { e.preventDefault(); destaque = Math.min(destaque + 1, achados.length - 1); marcar(); }
    if (e.key === "ArrowUp") { e.preventDefault(); destaque = Math.max(destaque - 1, 0); marcar(); }
    if (e.key === "Enter") { e.preventDefault(); irAchado(destaque); }
    if (e.key === "Escape") { $("#busca").value = ""; $("#resultados").hidden = true; $("#busca").blur(); }
    return;
  }
  if (e.key === "Escape") { fecharPops(); $("#app").classList.remove("side-open"); }
});

/* ------------------------------------------------------------------
   11. PARTIDA
------------------------------------------------------------------- */
function partir() {
  $("#verLogin").textContent = VERSAO;
  st.tema = ler("tema", "auto");
  tema(st.tema);
  st.recolhido = innerWidth < 1100 ? true : ler("recolhido", false);

  if (!window.supabase || !window.supabase.createClient) {
    msgLogin("A biblioteca do Supabase não carregou. Confira a conexão.");
    return;
  }
  if (!CFG.chave || CFG.chave.indexOf("COLE_AQUI") === 0) {
    msgLogin("Falta configurar a chave do projeto no início do arquivo.");
    return;
  }

  sb = window.supabase.createClient(CFG.url, CFG.chave, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });

  ligarLogin();

  sb.auth.getSession().then(function (r) {
    if (r.data && r.data.session) iniciarSessao(r.data.session);
  });

  sb.auth.onAuthStateChange(function (evento) {
    if (evento === "SIGNED_OUT") location.reload();
  });
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", partir);
else partir();

})();

</script>
